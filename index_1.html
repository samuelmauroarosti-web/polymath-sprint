const RESEARCH_SECONDS = 15 * 60;
const SPEAKING_SECONDS = 60;
const STORAGE_COVERED = "polymath-sprint-covered-topics";
const STORAGE_LOG = "polymath-sprint-session-log";

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

function beep(freq, duration, type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
    osc.start();
    osc.stop(ctx.currentTime + duration / 1000 + 0.05);
  } catch (e) {
    console.warn("Audio cue failed:", e);
  }
}

function researchEndCue() {
  beep(660, 220, "sine");
  setTimeout(() => beep(880, 260, "sine"), 260);
}
function speakingEndCue() {
  beep(220, 400, "sawtooth");
}

function toObsidianMarkdown(s) {
  return "---\n" +
    "title: " + s.topic + "\n" +
    "date: " + s.date + "\n" +
    "type: polymath-sprint\n" +
    "domain: " + s.domain + "\n" +
    "rating: " + s.rating + "/5\n" +
    "tags: [speaking-practice, " + s.domain + "]\n" +
    "---\n\n" +
    "## Topic\n" + s.topic + "\n\n" +
    "## Research Findings\n" + (s.findings || "_(none recorded)_") + "\n\n" +
    "## Speech\nVideo: " + (s.video || "_(none recorded)_") + "\n\n" +
    "## Self-Review\n" + (s.notes || "_(none recorded)_") + "\n\n" +
    "## Connections\n- [[ ]]\n";
}

function StatusDot({ color }) {
  return React.createElement("span", {
    className: "inline-block w-2 h-2 rounded-full mr-2 " + color
  });
}

function ProgressRing({ fraction, colorClass, size }) {
  const r = (size || 120) / 2 - 8;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(1, fraction)));
  return React.createElement("svg", { width: size || 120, height: size || 120, className: "-rotate-90" },
    React.createElement("circle", { cx: (size||120)/2, cy: (size||120)/2, r: r, stroke: "#232C36", strokeWidth: 6, fill: "none" }),
    React.createElement("circle", {
      cx: (size||120)/2, cy: (size||120)/2, r: r, stroke: "currentColor", strokeWidth: 6, fill: "none",
      strokeDasharray: c, strokeDashoffset: offset, strokeLinecap: "round",
      className: colorClass + " transition-all duration-1000 ease-linear"
    })
  );
}

function App() {
  const [phase, setPhase] = useState("idle"); // idle | research | getready | speaking | logging
  const [currentTopic, setCurrentTopic] = useState(null);
  const [timeLeft, setTimeLeft] = useState(RESEARCH_SECONDS);
  const [getReadyLeft, setGetReadyLeft] = useState(3);
  const [paused, setPaused] = useState(false);

  const [coveredTopics, setCoveredTopics] = useState([]);
  const [sessionLog, setSessionLog] = useState([]);
  const [loaded, setLoaded] = useState(false);

  const [domainFilter, setDomainFilter] = useState("all");
  const [view, setView] = useState("practice"); // practice | log
  const [resetConfirm, setResetConfirm] = useState(false);

  const [findings, setFindings] = useState("");
  const [video, setVideo] = useState("");
  const [notes, setNotes] = useState("");
  const [rating, setRating] = useState(0);
  const [savedFlash, setSavedFlash] = useState(false);
  const [copiedId, setCopiedId] = useState(null);
  const [storageError, setStorageError] = useState(false);

  // --- load persisted state on mount ---
  useEffect(() => {
    try {
      const c = localStorage.getItem(STORAGE_COVERED);
      const l = localStorage.getItem(STORAGE_LOG);
      setCoveredTopics(c ? JSON.parse(c) : []);
      setSessionLog(l ? JSON.parse(l) : []);
    } catch (e) {
      console.warn("Could not load saved progress:", e);
      setCoveredTopics([]);
      setSessionLog([]);
    }
    setLoaded(true);
  }, []);

  const persist = (covered, log) => {
    try {
      localStorage.setItem(STORAGE_COVERED, JSON.stringify(covered));
      localStorage.setItem(STORAGE_LOG, JSON.stringify(log));
      setStorageError(false);
    } catch (e) {
      console.warn("Could not save progress:", e);
      setStorageError(true);
    }
  };

  // --- countdown engine ---
  useEffect(() => {
    if (!(phase === "research" || phase === "speaking" || phase === "getready")) return;
    if (paused) return;
    const id = setInterval(() => {
      if (phase === "getready") {
        setGetReadyLeft(prev => {
          if (prev <= 1) {
            setPhase("speaking");
            setTimeLeft(SPEAKING_SECONDS);
            return 3;
          }
          return prev - 1;
        });
      } else {
        setTimeLeft(prev => {
          if (prev <= 1) {
            if (phase === "research") {
              researchEndCue();
              setPhase("getready");
              setGetReadyLeft(3);
            } else if (phase === "speaking") {
              speakingEndCue();
              setPhase("logging");
            }
            return 0;
          }
          return prev - 1;
        });
      }
    }, 1000);
    return () => clearInterval(id);
  }, [phase, paused]);

  const totalTopics = TOPICS.length;
  const coveredCount = coveredTopics.length;
  const allCovered = coveredCount >= totalTopics;

  const domainStats = useMemo(() => {
    const stats = {};
    Object.keys(DOMAIN_LABELS).forEach(d => { stats[d] = { total: 0, covered: 0 }; });
    TOPICS.forEach(t => {
      stats[t.domain].total += 1;
      if (coveredTopics.includes(t.title)) stats[t.domain].covered += 1;
    });
    return stats;
  }, [coveredTopics]);

  const eligiblePool = useMemo(() => {
    return TOPICS.filter(t =>
      (domainFilter === "all" || t.domain === domainFilter) &&
      !coveredTopics.includes(t.title)
    );
  }, [domainFilter, coveredTopics]);

  const pickTopic = (excludeTitle) => {
    let pool = eligiblePool;
    if (excludeTitle && pool.length > 1) {
      pool = pool.filter(t => t.title !== excludeTitle);
    }
    if (pool.length === 0) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  };

  const handleNewTopic = () => {
    const t = pickTopic(null);
    if (t) setCurrentTopic(t);
  };
  const handleReroll = () => {
    const t = pickTopic(currentTopic ? currentTopic.title : null);
    if (t) setCurrentTopic(t);
  };
  const startResearch = () => {
    if (!currentTopic) return;
    setTimeLeft(RESEARCH_SECONDS);
    setPaused(false);
    setPhase("research");
  };
  const skipToSpeaking = () => {
    setTimeLeft(SPEAKING_SECONDS);
    setPaused(false);
    setPhase("speaking");
  };
  const togglePause = () => setPaused(p => !p);

  const saveSession = () => {
    if (!currentTopic) return;
    const session = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      topic: currentTopic.title,
      domain: currentTopic.domain,
      date: new Date().toISOString(),
      findings, video, notes, rating,
    };
    const newLog = [session, ...sessionLog];
    const newCovered = coveredTopics.includes(currentTopic.title)
      ? coveredTopics
      : [...coveredTopics, currentTopic.title];
    setSessionLog(newLog);
    setCoveredTopics(newCovered);
    persist(newCovered, newLog);
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 2200);
    setFindings(""); setVideo(""); setNotes(""); setRating(0);
    setCurrentTopic(null);
    setPhase("idle");
  };

  const resetProgress = () => {
    setCoveredTopics([]);
    setSessionLog([]);
    persist([], []);
    setResetConfirm(false);
  };

  const copySession = (session) => {
    navigator.clipboard.writeText(toObsidianMarkdown(session)).then(() => {
      setCopiedId(session.id);
      setTimeout(() => setCopiedId(null), 1800);
    }).catch(() => {});
  };
  const copyFullLog = () => {
    const md = sessionLog.map(toObsidianMarkdown).join("\n\n---\n\n");
    navigator.clipboard.writeText(md).then(() => {
      setCopiedId("__full__");
      setTimeout(() => setCopiedId(null), 1800);
    }).catch(() => {});
  };

  if (!loaded) {
    return React.createElement("div", { className: "min-h-screen flex items-center justify-center text-inkdim font-mono text-sm" }, "Loading…");
  }

  /* ---------------- HEADER ---------------- */
  const header = React.createElement("div", { className: "border-b border-edge sticky top-0 bg-bgmain/95 backdrop-blur z-10" },
    React.createElement("div", { className: "max-w-3xl mx-auto px-4 py-4 flex items-center justify-between flex-wrap gap-2" },
      React.createElement("div", null,
        React.createElement("div", { className: "font-mono text-xs tracking-[0.3em] text-amber uppercase" }, "Polymath Sprint"),
        React.createElement("div", { className: "font-mono text-[11px] text-inkdim mt-0.5" }, "15:00 research — 1:00 speak — log — export")
      ),
      React.createElement("div", { className: "font-mono text-xs text-inkdim" },
        React.createElement("span", { className: "text-teal font-semibold" }, coveredCount),
        " / ",
        React.createElement("span", null, totalTopics),
        " topics covered"
      )
    ),
    React.createElement("div", { className: "max-w-3xl mx-auto px-4 pb-3 flex gap-4 font-mono text-xs" },
      React.createElement("button", {
        onClick: () => setView("practice"),
        className: "pb-1 border-b-2 " + (view === "practice" ? "border-amber text-ink" : "border-transparent text-inkdim hover:text-ink")
      }, "PRACTICE"),
      React.createElement("button", {
        onClick: () => setView("log"),
        className: "pb-1 border-b-2 " + (view === "log" ? "border-amber text-ink" : "border-transparent text-inkdim hover:text-ink")
      }, "SESSION LOG (" + sessionLog.length + ")")
    )
  );

  /* ---------------- DOMAIN FILTER PANEL ---------------- */
  const domainFilterPanel = React.createElement("div", { className: "bg-panel border border-edge rounded-lg p-4" },
    React.createElement("div", { className: "font-mono text-[11px] text-inkdim uppercase tracking-wider mb-3" }, "Domain filter"),
    React.createElement("div", { className: "flex flex-wrap gap-2" },
      React.createElement("button", {
        onClick: () => setDomainFilter("all"),
        className: "font-mono text-[11px] px-2.5 py-1.5 rounded border " +
          (domainFilter === "all" ? "border-amber text-amber bg-amber/10" : "border-edge text-inkdim hover:text-ink")
      }, "All (" + coveredCount + "/" + totalTopics + ")"),
      Object.keys(DOMAIN_LABELS).map(d =>
        React.createElement("button", {
          key: d,
          onClick: () => setDomainFilter(d),
          className: "font-mono text-[11px] px-2.5 py-1.5 rounded border " +
            (domainFilter === d ? "border-amber text-amber bg-amber/10" : "border-edge text-inkdim hover:text-ink")
        }, DOMAIN_LABELS[d] + " (" + domainStats[d].covered + "/" + domainStats[d].total + ")")
      )
    )
  );

  /* ---------------- IDLE VIEW ---------------- */
  let practiceBody;
  if (allCovered) {
    practiceBody = React.createElement("div", { className: "space-y-4" },
      React.createElement("div", { className: "bg-rose/10 border border-rose/40 rounded-lg p-5" },
        React.createElement("div", { className: "font-mono text-xs text-rose uppercase tracking-wider mb-2" }, "⚠ Bank exhausted"),
        React.createElement("p", { className: "text-sm text-ink" },
          "All ", totalTopics, " topics have been covered. Go back to Claude in this project and say ",
          React.createElement("span", { className: "font-mono text-amber" }, "\"refresh the topics\""),
          " to generate a new bank without repeating what you've already done."
        )
      ),
      React.createElement("button", {
        onClick: () => setResetConfirm(true),
        className: "font-mono text-[11px] text-inkdim hover:text-rose underline"
      }, "Reset progress instead")
    );
  } else if (phase === "idle") {
    practiceBody = React.createElement("div", { className: "space-y-4" },
      domainFilterPanel,
      currentTopic
        ? React.createElement("div", { className: "bg-panel border border-edge rounded-lg p-6" },
            React.createElement("div", { className: "flex items-center font-mono text-[11px] text-teal uppercase tracking-wider mb-3" },
              React.createElement(StatusDot, { color: "bg-teal" }), DOMAIN_LABELS[currentTopic.domain]
            ),
            React.createElement("div", { className: "text-xl font-semibold leading-snug mb-3" }, currentTopic.title),
            React.createElement("div", { className: "text-sm text-inkdim border-l-2 border-amber pl-3" }, currentTopic.hook),
            React.createElement("div", { className: "flex gap-3 mt-6" },
              React.createElement("button", {
                onClick: startResearch,
                className: "flex-1 bg-amber text-bgmain font-mono text-sm font-semibold px-4 py-3 rounded hover:opacity-90"
              }, "Start Research (15:00)"),
              React.createElement("button", {
                onClick: handleReroll,
                className: "font-mono text-sm px-4 py-3 rounded border border-edge text-inkdim hover:text-ink hover:border-inkdim"
              }, "Reroll")
            )
          )
        : React.createElement("div", { className: "bg-panel border border-edge border-dashed rounded-lg p-10 text-center" },
            React.createElement("p", { className: "text-inkdim text-sm mb-4 font-mono" }, "No topic selected"),
            React.createElement("button", {
              onClick: handleNewTopic,
              className: "bg-amber text-bgmain font-mono text-sm font-semibold px-6 py-3 rounded hover:opacity-90"
            }, "New Topic")
          )
    );
  } else if (phase === "research") {
    const frac = timeLeft / RESEARCH_SECONDS;
    practiceBody = React.createElement("div", { className: "bg-panel border border-edge rounded-lg p-6 text-center" },
      React.createElement("div", { className: "flex items-center justify-center font-mono text-[11px] text-amber uppercase tracking-wider mb-4" },
        React.createElement(StatusDot, { color: "bg-amber" }), "Research — ", DOMAIN_LABELS[currentTopic.domain]
      ),
      React.createElement("div", { className: "text-lg font-semibold mb-6 px-2" }, currentTopic.title),
      React.createElement("div", { className: "relative w-[160px] h-[160px] mx-auto mb-6 text-amber" },
        React.createElement(ProgressRing, { fraction: frac, colorClass: "text-amber", size: 160 }),
        React.createElement("div", { className: "absolute inset-0 flex items-center justify-center font-mono text-3xl font-semibold text-ink" }, fmt(timeLeft))
      ),
      React.createElement("div", { className: "flex justify-center gap-3" },
        React.createElement("button", {
          onClick: togglePause,
          className: "font-mono text-sm px-4 py-2.5 rounded border border-edge text-inkdim hover:text-ink hover:border-inkdim"
        }, paused ? "Resume" : "Pause"),
        React.createElement("button", {
          onClick: skipToSpeaking,
          className: "font-mono text-sm px-4 py-2.5 rounded border border-teal/50 text-teal hover:bg-teal/10"
        }, "Skip to Speaking →")
      )
    );
  } else if (phase === "getready") {
    practiceBody = React.createElement("div", { className: "bg-panel border border-teal/40 rounded-lg p-10 text-center" },
      React.createElement("div", { className: "font-mono text-[11px] text-teal uppercase tracking-wider mb-4" }, "Get ready"),
      React.createElement("div", { className: "font-mono text-6xl font-bold text-teal" }, getReadyLeft),
      React.createElement("p", { className: "text-sm text-inkdim mt-4" }, "Speaking starts in…")
    );
  } else if (phase === "speaking") {
    const frac = timeLeft / SPEAKING_SECONDS;
    const urgent = timeLeft <= 10;
    practiceBody = React.createElement("div", {
      className: "border rounded-lg p-6 text-center " + (urgent ? "bg-rose/10 border-rose/50" : "bg-teal/5 border-teal/40")
    },
      React.createElement("div", { className: "flex items-center justify-center font-mono text-[11px] uppercase tracking-wider mb-4 " + (urgent ? "text-rose" : "text-teal") },
        React.createElement(StatusDot, { color: urgent ? "bg-rose" : "bg-teal" }), "Speaking now"
      ),
      React.createElement("div", { className: "text-lg font-semibold mb-6 px-2" }, currentTopic.title),
      React.createElement("div", { className: "relative w-[200px] h-[200px] mx-auto mb-2 " + (urgent ? "text-rose" : "text-teal") },
        React.createElement(ProgressRing, { fraction: frac, colorClass: urgent ? "text-rose" : "text-teal", size: 200 }),
        React.createElement("div", {
          className: "absolute inset-0 flex items-center justify-center font-mono text-4xl font-bold " +
            (urgent ? "text-rose pulse-rose" : "text-ink")
        }, fmt(timeLeft))
      )
    );
  } else if (phase === "logging") {
    practiceBody = React.createElement("div", { className: "bg-panel border border-edge rounded-lg p-6 space-y-4" },
      React.createElement("div", { className: "font-mono text-[11px] text-amber uppercase tracking-wider" }, "Log this session"),
      React.createElement("div", null,
        React.createElement("div", { className: "font-mono text-[11px] text-inkdim mb-1" }, "Topic"),
        React.createElement("div", { className: "text-sm font-medium" }, currentTopic.title)
      ),
      React.createElement("div", null,
        React.createElement("label", { className: "font-mono text-[11px] text-inkdim mb-1 block" }, "Paste your research findings"),
        React.createElement("textarea", {
          value: findings, onChange: e => setFindings(e.target.value), rows: 5,
          className: "w-full bg-panel2 border border-edge rounded px-3 py-2 text-sm text-ink focus:outline-none focus:border-amber",
          placeholder: "What did you learn in the 15 minutes?"
        })
      ),
      React.createElement("div", null,
        React.createElement("label", { className: "font-mono text-[11px] text-inkdim mb-1 block" }, "Video link or filename"),
        React.createElement("input", {
          value: video, onChange: e => setVideo(e.target.value),
          className: "w-full bg-panel2 border border-edge rounded px-3 py-2 text-sm text-ink focus:outline-none focus:border-amber",
          placeholder: "e.g. drive link, or IMG_0231.mov"
        })
      ),
      React.createElement("div", null,
        React.createElement("label", { className: "font-mono text-[11px] text-inkdim mb-1 block" }, "Self-review notes (delivery, structure, filler words)"),
        React.createElement("textarea", {
          value: notes, onChange: e => setNotes(e.target.value), rows: 3,
          className: "w-full bg-panel2 border border-edge rounded px-3 py-2 text-sm text-ink focus:outline-none focus:border-amber"
        })
      ),
      React.createElement("div", null,
        React.createElement("div", { className: "font-mono text-[11px] text-inkdim mb-1" }, "Self-rating"),
        React.createElement("div", { className: "flex gap-2" },
          [1,2,3,4,5].map(n =>
            React.createElement("button", {
              key: n, onClick: () => setRating(n),
              className: "w-9 h-9 rounded font-mono text-sm border " +
                (rating >= n ? "bg-amber text-bgmain border-amber" : "border-edge text-inkdim hover:text-ink")
            }, n)
          )
        )
      ),
      React.createElement("button", {
        onClick: saveSession,
        disabled: findings.trim().length === 0,
        className: "w-full font-mono text-sm font-semibold px-4 py-3 rounded " +
          (findings.trim().length === 0
            ? "bg-panel2 text-inkdim cursor-not-allowed border border-edge"
            : "bg-amber text-bgmain hover:opacity-90")
      }, "Save Session")
    );
  }

  const savedToast = savedFlash ? React.createElement("div", {
    className: "fixed bottom-6 right-6 bg-teal text-bgmain font-mono text-xs font-semibold px-4 py-2.5 rounded shadow-lg"
  }, "Saved ✓ synced") : null;

  const storageWarning = storageError ? React.createElement("div", {
    className: "fixed bottom-6 left-6 bg-rose text-white font-mono text-xs px-4 py-2.5 rounded shadow-lg"
  }, "⚠ Could not save — storage unavailable") : null;

  /* ---------------- LOG VIEW ---------------- */
  const logView = React.createElement("div", { className: "space-y-4" },
    sessionLog.length === 0
      ? React.createElement("div", { className: "text-center text-inkdim font-mono text-sm py-16 border border-dashed border-edge rounded-lg" }, "No sessions saved yet")
      : React.createElement("button", {
          onClick: copyFullLog,
          className: "font-mono text-xs px-3 py-2 rounded border border-edge text-inkdim hover:text-ink hover:border-inkdim"
        }, copiedId === "__full__" ? "Copied ✓" : "Copy entire log as Obsidian Markdown"),
    sessionLog.map(s =>
      React.createElement("div", { key: s.id, className: "bg-panel border border-edge rounded-lg p-4" },
        React.createElement("div", { className: "flex items-start justify-between gap-3" },
          React.createElement("div", null,
            React.createElement("div", { className: "font-mono text-[11px] text-teal uppercase tracking-wider mb-1" },
              DOMAIN_LABELS[s.domain], " · ", new Date(s.date).toLocaleDateString()
            ),
            React.createElement("div", { className: "font-medium text-sm" }, s.topic),
            React.createElement("div", { className: "font-mono text-[11px] text-inkdim mt-1" }, "Rating: " + s.rating + "/5")
          ),
          React.createElement("button", {
            onClick: () => copySession(s),
            className: "font-mono text-[11px] px-2.5 py-1.5 rounded border border-edge text-inkdim hover:text-ink shrink-0"
          }, copiedId === s.id ? "Copied ✓" : "Copy as Markdown")
        ),
        s.findings ? React.createElement("p", { className: "text-xs text-inkdim mt-3 line-clamp-3" }, s.findings) : null
      )
    )
  );

  /* ---------------- RESET CONFIRM MODAL ---------------- */
  const resetModal = resetConfirm ? React.createElement("div", {
    className: "fixed inset-0 bg-black/60 flex items-center justify-center z-20 p-4"
  },
    React.createElement("div", { className: "bg-panel border border-rose/50 rounded-lg p-6 max-w-sm w-full" },
      React.createElement("div", { className: "font-mono text-[11px] text-rose uppercase tracking-wider mb-2" }, "Reset progress?"),
      React.createElement("p", { className: "text-sm text-inkdim mb-5" }, "This clears your covered-topics count and full session log from this device. Your Obsidian exports are unaffected."),
      React.createElement("div", { className: "flex gap-3" },
        React.createElement("button", { onClick: resetProgress, className: "flex-1 bg-rose text-white font-mono text-xs font-semibold px-3 py-2.5 rounded" }, "Yes, reset"),
        React.createElement("button", { onClick: () => setResetConfirm(false), className: "flex-1 border border-edge text-inkdim font-mono text-xs px-3 py-2.5 rounded" }, "Cancel")
      )
    )
  ) : null;

  return React.createElement("div", { className: "min-h-screen" },
    header,
    React.createElement("div", { className: "max-w-3xl mx-auto px-4 py-6" },
      view === "practice" ? practiceBody : logView
    ),
    savedToast, storageWarning, resetModal
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
