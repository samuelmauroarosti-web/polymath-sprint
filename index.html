function visualToMarkdown(v, oldText) {

  if (v.type === "comparison" && v.left && v.right) {

      "\n\n**vs**\n\n**" + v.right.label + "**\n" + (v.right.points || []).map(p => "- " + p).join("\n") + "\n";
  } else if (v.type === "timeline" && v.events) {
    body += v.events.map((e, i) => (i + 1) + ". **" + e.label + "** — " + (e.detail || "")).join("\n") + "\n";
  } else if (v.type === "cycle" && v.steps) {
    body += v.steps.map((s2, i) => (i + 1) + ". **" + s2.label + "** — " + (s2.detail || "")).join("\n") + "\n(repeats back to step 1)\n";
  } else if (v.type === "flow" && v.steps) {
    body += v.steps.map(s2 => s2.label).join(" → ") + "\n" + v.steps.map((s2, i) => (i + 1) + ". " + s2.label + (s2.detail ? " — " + s2.detail : "")).join("\n") + "\n";

}
